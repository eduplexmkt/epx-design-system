(function(){var NS=window.MontageDesignSystem_4afdc8;if(!NS||!NS.Icon)return;var O=NS.Icon;NS.Icon=function(p){var R=window.__resources||{};var u=p.src||R['icon_'+p.name];return O(Object.assign({},p,{src:u}));};})();

<script type="text/babel" src="Gnb.jsx"></script>
<script type="text/babel" src="Lnb.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="DocPage.jsx"></script>
<script type="text/babel">
const { Icon, SearchField, TextField } = window.MontageDesignSystem_4afdc8;
const ANCHORS = { Button: ['Variant', 'Size', 'State', 'Props'], Color: ['Semantic tokens', 'Accent'] };

function App() {
  const [theme, setTheme] = React.useState('light');
  const [section, setSection] = React.useState('components');
  const [page, setPage] = React.useState('Button');
  const [anchor, setAnchor] = React.useState('Variant');
  const [search, setSearch] = React.useState(false);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  const pickSection = (s) => {
    setSection(s);
    const first = window.LNB_PAGES[s][0].items[0];
    setPage(first);
    setAnchor((ANCHORS[first] || ['Selection & input'])[0]);
  };
  const pickPage = (p) => { setPage(p); setAnchor((ANCHORS[p] || ['Selection & input'])[0]); };

  return (
    <div>
      <Gnb section={section} onSection={pickSection} theme={theme} onTheme={() => setTheme(theme === 'light' ? 'dark' : 'light')} onSearch={() => setSearch(true)} />
      <div style={{ display: 'flex', gap: 40, width: '100%', margin: '0 auto', maxWidth: 'var(--layout-max-width)', boxSizing: 'content-box' }}>
        <Lnb section={section} page={page} onPage={pickPage} />
        <main style={{ display: 'flex', gap: 20, width: 'calc(100% - 230px)', paddingLeft: 60 }}>
          <div style={{ display: 'flex', flexDirection: 'column', flex: '1 1 0', minWidth: 0, padding: '56px var(--layout-padding-inline) 0', maxWidth: 'min(840px, 100%)' }}>
            <DocPage section={section} page={page} />
            <Footer />
          </div>
          <Sidebar anchors={ANCHORS[page] || ['Selection & input', 'Navigation', 'Contents & feedback', 'Loading']} active={anchor} onAnchor={setAnchor} />
        </main>
      </div>
      {search && (
        <div onClick={() => setSearch(false)} style={{ position: 'fixed', inset: 0, zIndex: 1400, background: 'var(--semantic-material-dimmer)', display: 'flex', justifyContent: 'center', paddingTop: 120 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: 'min(560px, 90vw)', height: 'fit-content', borderRadius: 12, padding: 12, background: 'var(--semantic-background-elevated-normal)', boxShadow: 'var(--elevation-shadow-xlarge)' }}>
            <SearchField autoFocus leadingContent={<Icon name="search" size={20} />} placeholder="Search documentation" width="100%" />
            <div style={{ padding: '14px 12px 6px', fontSize: 13, lineHeight: '18px', color: 'var(--semantic-label-assistive)' }}>Algolia DocSearch · ⌘K</div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
