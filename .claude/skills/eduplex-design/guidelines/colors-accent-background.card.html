<!-- @dsCard group="Colors" viewport="700x115" name="Accent — background" subtitle="Eight saturated fills for category art. Never for text." -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Accent background</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
.sw{min-width:0;flex:1 1 0}</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:48px;background:var(--semantic-accent-background-redOrange)"></div><div class="n">redOrange</div><div class="v">#FF5E00</div></div><div class="sw"><div class="chip" style="height:48px;background:var(--semantic-accent-background-lime)"></div><div class="n">lime</div><div class="v">#58CF04</div></div><div class="sw"><div class="chip" style="height:48px;background:var(--semantic-accent-background-cyan)"></div><div class="n">cyan</div><div class="v">#00BDDE</div></div><div class="sw"><div class="chip" style="height:48px;background:var(--semantic-accent-background-lightBlue)"></div><div class="n">lightBlue</div><div class="v">#00AEFF</div></div><div class="sw"><div class="chip" style="height:48px;background:var(--semantic-accent-background-violet)"></div><div class="n">violet</div><div class="v">#6541F2</div></div><div class="sw"><div class="chip" style="height:48px;background:var(--semantic-accent-background-purple)"></div><div class="n">purple</div><div class="v">#CB59FF</div></div><div class="sw"><div class="chip" style="height:48px;background:var(--semantic-accent-background-pink)"></div><div class="n">pink</div><div class="v">#F553DA</div></div></div></body></html>
