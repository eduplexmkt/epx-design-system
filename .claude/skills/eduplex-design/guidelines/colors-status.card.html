<!-- @dsCard group="Colors" viewport="700x130" name="Status" subtitle="Three states, each with an 8% background tint" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-status-positive)"></div><div class="n">status.positive</div><div class="v">#00BF40</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-status-cautionary)"></div><div class="n">status.cautionary</div><div class="v">#FF9200</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-status-negative)"></div><div class="n">status.negative</div><div class="v">#FF4242</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-background-status-positive)"></div><div class="n">bg.status.positive</div><div class="v">@ 8%</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-background-status-cautionary)"></div><div class="n">bg.status.cautionary</div><div class="v">@ 8%</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-background-status-negative)"></div><div class="n">bg.status.negative</div><div class="v">@ 8%</div></div></div></body></html>
