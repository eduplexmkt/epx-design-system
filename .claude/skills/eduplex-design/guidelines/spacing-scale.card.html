<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="20 steps — 0.5, 1, 2, 6, 10, 14 exist because components need them" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
.b{background:var(--semantic-primary-normal);height:24px;border-radius:2px}
.s{display:flex;flex-direction:column;gap:6px;align-items:flex-start}</style></head><body><div class="row" style="gap:12px;align-items:flex-end"><div class="s"><div class="b" style="width:0"></div><span class="v">0</span></div><div class="s"><div class="b" style="width:0.5px"></div><span class="v">0.5</span></div><div class="s"><div class="b" style="width:1px"></div><span class="v">1</span></div><div class="s"><div class="b" style="width:2px"></div><span class="v">2</span></div><div class="s"><div class="b" style="width:4px"></div><span class="v">4</span></div><div class="s"><div class="b" style="width:6px"></div><span class="v">6</span></div><div class="s"><div class="b" style="width:8px"></div><span class="v">8</span></div><div class="s"><div class="b" style="width:10px"></div><span class="v">10</span></div><div class="s"><div class="b" style="width:12px"></div><span class="v">12</span></div><div class="s"><div class="b" style="width:14px"></div><span class="v">14</span></div><div class="s"><div class="b" style="width:16px"></div><span class="v">16</span></div><div class="s"><div class="b" style="width:20px"></div><span class="v">20</span></div><div class="s"><div class="b" style="width:24px"></div><span class="v">24</span></div><div class="s"><div class="b" style="width:32px"></div><span class="v">32</span></div><div class="s"><div class="b" style="width:40px"></div><span class="v">40</span></div><div class="s"><div class="b" style="width:48px"></div><span class="v">48</span></div><div class="s"><div class="b" style="width:56px"></div><span class="v">56</span></div><div class="s"><div class="b" style="width:64px"></div><span class="v">64</span></div><div class="s"><div class="b" style="width:72px"></div><span class="v">72</span></div><div class="s"><div class="b" style="width:80px"></div><span class="v">80</span></div></div></body></html>
