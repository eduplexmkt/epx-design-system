<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="Radius is per component and grows with size — there is no single card radius" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Radius</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
.b{width:76px;height:56px;background:var(--semantic-fill-normal);box-shadow:inset 0 0 0 1px var(--semantic-line-normal-neutral)}</style></head><body><div class="row" style="gap:14px"><div class="sw" style="min-width:76px"><div class="b" style="border-radius:5px"></div><div class="n">5px</div><div class="v">checkbox</div></div><div class="sw" style="min-width:76px"><div class="b" style="border-radius:6px"></div><div class="n">6px</div><div class="v">chip xsmall / tooltip s</div></div><div class="sw" style="min-width:76px"><div class="b" style="border-radius:8px"></div><div class="n">8px</div><div class="v">button s / chip</div></div><div class="sw" style="min-width:76px"><div class="b" style="border-radius:10px"></div><div class="n">10px</div><div class="v">button m / badge m</div></div><div class="sw" style="min-width:76px"><div class="b" style="border-radius:12px"></div><div class="n">12px</div><div class="v">button l / field / card</div></div><div class="sw" style="min-width:76px"><div class="b" style="border-radius:14px"></div><div class="n">14px</div><div class="v">avatar xl</div></div></div></body></html>
