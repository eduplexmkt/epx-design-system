<!-- @dsCard group="Brand" viewport="700x400" name="Logo" subtitle="밝은 배경엔 Main Color, 어두운 배경엔 White&Point Color" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Logo</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal)}
.col{display:flex;flex-direction:column;gap:14px}
.box{display:flex;align-items:center;padding:22px 24px;border-radius:12px}
.box img{height:30px;display:block}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-assistive)}</style></head>
<body><div class="col">
<div class="box" style="background:var(--semantic-background-normal-alternative)"><img src="../assets/logo/eduplex-main.svg" alt="에듀플렉스"></div>
<div class="n">eduplex-main.svg — 밝은 배경 (Main Color)</div>
<div class="box" style="background:var(--semantic-primary-normal)"><img src="../assets/logo/eduplex-white-point.svg" alt="에듀플렉스"></div>
<div class="n">eduplex-white-point.svg — 어두운 배경 · 브랜드 컬러 배경 (White&amp;Point Color)</div>
<div class="box" style="background:var(--semantic-inverse-background)"><img src="../assets/logo/eduplex-white-point.svg" alt="에듀플렉스"></div>
<div class="n">단색이 필요한 경우에만 eduplex-black.svg / eduplex-white.svg</div>
</div></body></html>
