<!-- @dsCard group="Colors" viewport="700x160" name="Line" subtitle="Translucent normal.* over content; opaque solid.* on flat surfaces" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Line</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
.demo{padding:14px;border-radius:10px;background:var(--semantic-background-normal-normal)}
.r{display:flex;align-items:center;gap:12px;height:34px}.bar{flex:1 1 auto;height:0}</style></head><body><div class="col">
<div class="r"><span class="n" style="width:190px">line.normal.normal</span><span class="bar" style="border-bottom:1px solid var(--semantic-line-normal-normal)"></span><span class="v">coolNeutral.50 @ 22%</span></div>
<div class="r"><span class="n" style="width:190px">line.normal.neutral</span><span class="bar" style="border-bottom:1px solid var(--semantic-line-normal-neutral)"></span><span class="v">@ 16% — default border</span></div>
<div class="r"><span class="n" style="width:190px">line.normal.alternative</span><span class="bar" style="border-bottom:1px solid var(--semantic-line-normal-alternative)"></span><span class="v">@ 8% — list rows</span></div>
<div class="r"><span class="n" style="width:190px">line.solid.normal</span><span class="bar" style="border-bottom:1px solid var(--semantic-line-solid-normal)"></span><span class="v">#E1E2E4 opaque</span></div>
<div class="r"><span class="n" style="width:190px">line.primary.strong</span><span class="bar" style="border-bottom:1px solid var(--semantic-line-primary-strong)"></span><span class="v">primary @ 43% — selected</span></div>
</div></body></html>
