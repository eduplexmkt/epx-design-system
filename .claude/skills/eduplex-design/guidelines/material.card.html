<!-- @dsCard group="Brand" viewport="700x170" name="Frosted material" subtitle="blur(32px) over a translucent surface — navigation, toasts, tooltips, fields" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Material</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
body{background:linear-gradient(120deg,var(--atomic-blue-50),var(--atomic-violet-50) 55%,var(--atomic-pink-50))}
.p{padding:14px 16px;border-radius:12px;backdrop-filter:blur(32px);font-size:15px;line-height:22px;font-weight:600}
.n,.v{color:#fff}</style></head><body><div class="col" style="gap:12px">
<div class="p" style="background:color-mix(in srgb, var(--semantic-background-elevated-normal) 88%, transparent);color:var(--semantic-label-normal)">navigation · elevated surface @ 88%</div>
<div class="p" style="background:color-mix(in srgb, var(--semantic-inverse-background) 88%, transparent);color:var(--semantic-inverse-label)">tooltip · inverse background @ 88%</div>
<div class="p" style="background:color-mix(in srgb, var(--semantic-inverse-background) 52%, transparent);color:var(--semantic-inverse-label)">toast · inverse background @ 52% + 5% primary wash</div>
</div></body></html>
