<!-- @dsCard group="Brand" viewport="700x160" name="Elevation" subtitle="Five near-neutral steps built on #171717 at 6–12% — never colored" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
.b{width:96px;height:72px;border-radius:12px;background:var(--semantic-background-elevated-normal)}
body{background:var(--semantic-background-normal-alternative)}</style></head><body><div class="row" style="gap:18px"><div class="sw" style="min-width:96px"><div class="b" style="box-shadow:var(--elevation-shadow-xsmall)"></div><div class="n">xsmall</div></div><div class="sw" style="min-width:96px"><div class="b" style="box-shadow:var(--elevation-shadow-small)"></div><div class="n">small</div></div><div class="sw" style="min-width:96px"><div class="b" style="box-shadow:var(--elevation-shadow-medium)"></div><div class="n">medium</div></div><div class="sw" style="min-width:96px"><div class="b" style="box-shadow:var(--elevation-shadow-large)"></div><div class="n">large</div></div><div class="sw" style="min-width:96px"><div class="b" style="box-shadow:var(--elevation-shadow-xlarge)"></div><div class="n">xlarge</div></div></div></body></html>
