<!-- @dsCard group="Colors" viewport="700x140" name="Fill, inverse & dimmer" subtitle="Translucent grey fills; inverse surface for toasts and tooltips" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Fill</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-fill-alternative)"></div><div class="n">fill.alternative</div><div class="v">coolNeutral.50 @ 5%</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-fill-normal)"></div><div class="n">fill.normal</div><div class="v">@ 8%</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-fill-strong)"></div><div class="n">fill.strong</div><div class="v">@ 16%</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-inverse-background)"></div><div class="n">inverse.background</div><div class="v">#1B1C1E</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-material-dimmer)"></div><div class="n">material.dimmer</div><div class="v">coolNeutral.10 @ 52%</div></div></div></body></html>
