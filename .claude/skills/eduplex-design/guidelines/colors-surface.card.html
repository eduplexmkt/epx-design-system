<!-- @dsCard group="Colors" viewport="700x130" name="Background & surface" subtitle="White page, #F7F7F8 alternative — elevated equals normal in light mode" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Surface</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
.chip{box-shadow:inset 0 0 0 1px var(--semantic-line-normal-normal)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-background-normal-normal)"></div><div class="n">background.normal.normal</div><div class="v">#ffffff</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-background-normal-alternative)"></div><div class="n">background.normal.alternative</div><div class="v">#F7F7F8</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-interaction-disable)"></div><div class="n">interaction.disable</div><div class="v">#F4F4F5</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-interaction-inactive)"></div><div class="n">interaction.inactive</div><div class="v">#989BA2</div></div></div></body></html>
