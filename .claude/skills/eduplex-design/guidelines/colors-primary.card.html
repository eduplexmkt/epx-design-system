<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Primary</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-primary-normal)"></div><div class="n">primary.normal</div><div class="v">#0054A7</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-primary-strong)"></div><div class="n">primary.strong</div><div class="v">#004386</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-primary-heavy)"></div><div class="n">primary.heavy</div><div class="v">#003264</div></div><div class="sw"><div class="chip" style="height:52px;background:var(--semantic-inverse-primary)"></div><div class="n">inverse.primary</div><div class="v">#3376B9</div></div></div><p style="margin:12px 0 0;font-size:11px;line-height:16px;letter-spacing:.0311em;color:var(--semantic-label-alternative)">이 프로젝트는 strong·heavy를 상류보다 한 단계씩 진하게 씁니다 — 상류 값은 strong <code>#004C96</code>(blue.45), heavy <code>#004386</code>(blue.40). 의도된 로컬 편차이며 <code>guidelines/source-provenance.md</code>에 기록되어 있습니다.</p></body></html>
