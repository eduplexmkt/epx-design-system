<!-- @dsCard group="Colors" viewport="700x150" name="Label (text)" subtitle="Six text tiers, five of them translucent cool-neutral over the page" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Label</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
.line{display:flex;align-items:baseline;gap:12px}.big{font-size:20px;line-height:28px;font-weight:600}</style></head><body><div class="col">
<div class="line"><span class="big" style="color:var(--semantic-label-strong)">label.strong</span><span class="v">#000000</span></div>
<div class="line"><span class="big" style="color:var(--semantic-label-normal)">label.normal</span><span class="v">coolNeutral.10 · #171719</span></div>
<div class="line"><span class="big" style="color:var(--semantic-label-neutral)">label.neutral</span><span class="v">coolNeutral.22 @ 88%</span></div>
<div class="line"><span class="big" style="color:var(--semantic-label-alternative)">label.alternative</span><span class="v">coolNeutral.25 @ 61%</span></div>
<div class="line"><span class="big" style="color:var(--semantic-label-assistive)">label.assistive</span><span class="v">coolNeutral.25 @ 28% — placeholders only</span></div>
<div class="line"><span class="big" style="color:var(--semantic-label-disable)">label.disable</span><span class="v">coolNeutral.25 @ 16%</span></div>
</div></body></html>
