<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Blue scale</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal);color:var(--semantic-label-normal)}

.sw{display:flex;flex-direction:column;gap:6px;min-width:96px}
.chip{height:52px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--semantic-line-normal-alternative)}
.n{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-normal)}
.v{font-size:11px;line-height:14px;letter-spacing:.0311em;color:var(--semantic-label-assistive);font-family:var(--font-family-mono)}
.chip{border-radius:6px}.sw{min-width:0;flex:1 1 0}</style></head><body><div class="row"><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-10)"></div><div class="n">10</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-20)"></div><div class="n">20</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-30)"></div><div class="n">30</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-40)"></div><div class="n">40</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-45)"></div><div class="n">45</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-50)"></div><div class="n">50</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-55)"></div><div class="n">55</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-60)"></div><div class="n">60</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-65)"></div><div class="n">65</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-70)"></div><div class="n">70</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-80)"></div><div class="n">80</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-90)"></div><div class="n">90</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-95)"></div><div class="n">95</div><div class="v"></div></div><div class="sw"><div class="chip" style="height:44px;background:var(--atomic-blue-99)"></div><div class="n">99</div><div class="v"></div></div></div></body></html>
