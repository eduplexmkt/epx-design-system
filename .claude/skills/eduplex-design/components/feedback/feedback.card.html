<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Feedback</title><link rel="stylesheet" href="../../styles.css">
<script>window.__WDS_ICON_BASE__='../../assets/icons'</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--semantic-background-normal-normal)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:11px;line-height:14px;letter-spacing:.0311em;font-weight:500;color:var(--semantic-label-assistive)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { SectionMessage, Toast, Tooltip, TextButton, Icon } = window.MontageDesignSystem_4afdc8;
function Demo(){
  return (
    <div className="col">
      <SectionMessage variant="info" icon={<Icon name="circle-info" size={20} />} title="위클리 플랜을 제출해 보세요">
        마감은 월요일 오후 2시까지 입니다.
      </SectionMessage>
      <div className="row" style={{gap:12,alignItems:'flex-start'}}>
        <div style={{flex:'1 1 0',minWidth:0}}>
          <SectionMessage variant="cautionary" icon={<Icon name="circle-info" size={20} />}>위클리 제출 마감이 3일 남았습니다.</SectionMessage>
        </div>
        <div style={{flex:'1 1 0',minWidth:0}}>
          <SectionMessage variant="negative" icon={<Icon name="circle-info" size={20} />}>첨부 파일 형식을 확인해 주세요.</SectionMessage>
        </div>
      </div>
      <div className="row" style={{gap:16,alignItems:'center'}}>
        <Toast icon={<Icon name="check" size={20} />} action={<TextButton size="small" style={{color:'var(--semantic-inverse-label)'}}>보기</TextButton>}>위클리가 저장되었습니다.</Toast>
        <div className="col" style={{gap:10}}>
          <Tooltip>상담 신청시 공부유형검사가 무료입니다.</Tooltip>
          <Tooltip size="small" shortcut="⌘K">검색</Tooltip>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
